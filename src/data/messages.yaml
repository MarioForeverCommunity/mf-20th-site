- username: "小胖有萌新"
  content: "从14年到现在接触MF系列的作品，一开始就不会玩，卡在原版8-3未通关，后面慢慢的熟练了起来，17年的时候开始玩MF改版系列的作品，比如负数世界，MFR等……\n一开始MFR是在网上找的国外的2.3b版，然后又升级了3.5b版，穿越到了18年，又玩了TMW相关的作品。\n后来因电脑故障无法继续游玩……\n然后时间到了19年，就开始玩安卓版，列如：Mario Forever Android和Mario Worker Android。\n到了23年，回归用电脑打MFR4.02B版，字母世界等……\n从24年开始发布MF系列的作品到现在。曾经的我，打国外最难作品挂命率过高，就比如波兰字母，不补给之旅，罗马世界那些的。\n从去年开始就体验了部分的国内作品，如：LGR，MF A Fabulous Space。\n到了现在，技术上升，本人也尝试了部分的最难关。\n最初时打难关气的想骂人了……。\n后面慢慢反复练习，慢慢尝试才能通关。\n祝贺永吧20周年快乐！！！"
